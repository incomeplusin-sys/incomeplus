<!DOCTYPE html>
<html lang="en">
<head>
<title>IncomePlus Pro | Real-time NSE Stock Volume Pattern Scanner</title>
<meta name="title" content="IncomePlus Pro | Real-time NSE Stock Volume Pattern Scanner">
<meta name="description" content="Free real-time NSE stock scanner for U-patterns, V-patterns, and Pyramid volume breakouts. Powered by Angel One SmartApi for professional intraday traders.">
<meta name="keywords" content="NSE volume scanner, stock pattern scanner, intraday volume breakout, Angel One API scanner, U pattern stocks, V pattern stocks, Indian stock market tools">

<meta property="og:type" content="website">
<meta property="og:url" content="https://incomeplusin-sys.github.io/incomeplus/">
<meta property="og:title" content="IncomePlus Pro | Master Volume Scanner">
<meta property="og:description" content="Detect high-probability volume patterns in real-time. Use professional tools for free.">
<meta property="og:image" content="https://incomeplusin-sys.github.io/incomeplus/assets/preview-image.jpg">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IncomePlus Pro - Master Scanner</title>
    <style>
        :root { --primary: #1e3c72; --secondary: #2a5298; --success: #28a745; --danger: #dc3545; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f9; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .header { text-align: center; border-bottom: 2px solid #eee; margin-bottom: 20px; padding-bottom: 10px; }
        .status-bar { display: flex; justify-content: space-between; align-items: center; background: #eef2f7; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-weight: 600; }
        .controls { display: flex; gap: 10px; justify-content: center; margin-bottom: 25px; flex-wrap: wrap; }
        .btn { padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; color: white; }
        .btn-scan { background: var(--primary); }
        .btn-save { background: var(--success); }
        .btn-time { background: #6c757d; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .online { color: var(--success); }
        .offline { color: var(--danger); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #f8f9fa; color: var(--primary); padding: 15px; text-align: left; border-bottom: 2px solid #dee2e6; }
        td { padding: 15px; border-bottom: 1px solid #eee; }
        .pattern-tag { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .tag-yes { background: #d4edda; color: #155724; }
        .tag-no { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>IncomePlus Master Scanner</h1>
        <p>Real-time Angel One SmartApi Integration</p>
    </div>

    <div class="status-bar">
        <div>📡 API: <span id="apiStatus" class="offline">Checking Connection...</span></div>
        <div>⏰ Timeframe: <span id="currentTimeframe">ONE_DAY</span></div>
        <div>🕒 Refresh in: <span id="timer">60</span>s</div>
    </div>

    <div class="controls">
        <select id="timeframeSelect" class="btn btn-time" style="color:white; background:#6c757d; padding:10px;">
            <option value="ONE_DAY">Daily</option>
            <option value="ONE_HOUR">1 Hour</option>
            <option value="FIFTEEN_MINUTE">15 Minute</option>
        </select>
        <button class="btn btn-scan" onclick="runAdvancedScan()">🚀 Start Advanced Scan</button>
        <button class="btn btn-save" onclick="downloadCSV()">💾 Save Results (CSV)</button>
    </div>

    <div id="resultsWrapper" style="display:none;">
        <table id="resultsTable">
            <thead>
                <tr>
                    <th>Symbol</th>
                    <th>Price</th>
                    <th>Change %</th>
                    <th>V-Pattern</th>
                    <th>U-Pattern</th>
                    <th>Pyramid</th>
                    <th>VMA Status</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    const API_URL = "https://web-production-561f3.up.railway.app";
    let timeLeft = 60;

    async function checkStatus() {
        try {
            const res = await fetch(`${API_URL}/health`);
            if(res.ok) {
                document.getElementById('apiStatus').innerText = "ONLINE ✅";
                document.getElementById('apiStatus').className = "online";
            }
        } catch (e) {
            document.getElementById('apiStatus').innerText = "OFFLINE ❌ (Ensure Railway is Active)";
            document.getElementById('apiStatus').className = "offline";
        }
    }

    async function runAdvancedScan() {
        const tf = document.getElementById('timeframeSelect').value;
        document.getElementById('currentTimeframe').innerText = tf;
        
        try {
            const res = await fetch(`${API_URL}/scan`, { 
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ timeframe: tf })
            });
            const result = await res.json();
            const body = document.getElementById('tableBody');
            body.innerHTML = '';

            result.data.forEach(stock => {
                body.innerHTML += `
                    <tr>
                        <td><strong>${stock.ticker}</strong></td>
                        <td>₹${stock.price}</td>
                        <td style="color:${stock.change >= 0 ? 'green' : 'red'}">${stock.change}%</td>
                        <td><span class="pattern-tag ${stock.v_pat ? 'tag-yes' : 'tag-no'}">${stock.v_pat ? '✅ YES' : '❌ NO'}</span></td>
                        <td><span class="pattern-tag ${stock.u_pat ? 'tag-yes' : 'tag-no'}">${stock.u_pat ? '✅ YES' : '❌ NO'}</span></td>
                        <td><span class="pattern-tag ${stock.p_pat ? 'tag-yes' : 'tag-no'}">${stock.p_pat ? '✅ YES' : '❌ NO'}</span></td>
                        <td>${stock.vma_status || 'Above Avg'}</td>
                    </tr>`;
            });
            document.getElementById('resultsWrapper').style.display = 'block';
        } catch (e) {
            alert("Scan failed. Check console for details.");
        }
    }

    function downloadCSV() {
        let csv = "Symbol,Price,Change,V-Pattern,U-Pattern,Pyramid\n";
        const rows = document.querySelectorAll("#tableBody tr");
        rows.forEach(row => {
            const cols = row.querySelectorAll("td");
            let rowData = Array.from(cols).map(c => c.innerText.replace('✅ ', '').replace('❌ ', '')).join(",");
            csv += rowData + "\n";
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `IncomePlus_Scan_${new Date().getTime()}.csv`;
        a.click();
    }

    // Timer Logic
    setInterval(() => {
        timeLeft--;
        document.getElementById('timer').innerText = timeLeft;
        if(timeLeft <= 0) { timeLeft = 60; checkStatus(); }
    }, 1000);

    window.onload = checkStatus;
</script>
</body>
</html>
