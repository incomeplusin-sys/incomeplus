<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IncomePlus - Live Scanner</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .header { text-align: center; margin-bottom: 30px; }
        .status-box { display: flex; justify-content: space-between; background: #e9ecef; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; }
        .online { color: #28a745; }
        .offline { color: #dc3545; }
        .btn { background: #007bff; color: white; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-size: 16px; }
        .btn:hover { background: #0056b3; }
        table { width: 100%; border-collapse: collapse; margin-top: 25px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #dee2e6; }
        th { background: #f8f9fa; color: #495057; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>IncomePlus Pro Scanner</h1>
        <p>Institutional Volume Pattern Detector</p>
    </div>

    <div class="status-box">
        <div>📡 API Status: <span id="apiStatus" class="offline">Checking...</span></div>
        <div>🕒 Auto-Refresh: <span id="timer">60</span>s</div>
    </div>

    <div style="text-align:center;">
        <button class="btn" onclick="runScan()">🚀 Start New Scan</button>
    </div>

    <div id="resultsTable" style="display:none;">
        <table>
            <thead>
                <tr>
                    <th>Symbol</th>
                    <th>Price</th>
                    <th>Change %</th>
                    <th>V-Pattern</th>
                    <th>U-Pattern</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    // YOUR UNIQUE RAILWAY URL
    const API_URL = "https://web-production-561f3.up.railway.app";
    let timeLeft = 60;

    async function checkStatus() {
        try {
            const res = await fetch(`${API_URL}/health`);
            const statusLabel = document.getElementById('apiStatus');
            if(res.ok) {
                statusLabel.innerText = "ONLINE ✅";
                statusLabel.className = "online";
            }
        } catch (e) {
            document.getElementById('apiStatus').innerText = "OFFLINE ❌";
            document.getElementById('apiStatus').className = "offline";
        }
    }

    async function runScan() {
        try {
            const res = await fetch(`${API_URL}/scan`, { method: 'POST' });
            const result = await res.json();
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';
            
            result.data.forEach(stock => {
                tableBody.innerHTML += `
                    <tr>
                        <td><strong>${stock.ticker}</strong></td>
                        <td>₹${stock.price}</td>
                        <td style="color:${stock.change_percent >= 0 ? 'green' : 'red'}">${stock.change_percent}%</td>
                        <td>${stock.v_pattern ? '✅' : '❌'}</td>
                        <td>${stock.u_pattern ? '✅' : '❌'}</td>
                    </tr>`;
            });
            document.getElementById('resultsTable').style.display = 'block';
        } catch (e) {
            alert("API connection failed. Ensure Railway is running.");
        }
    }

    // Refresh Logic
    setInterval(() => {
        timeLeft--;
        document.getElementById('timer').innerText = timeLeft;
        if(timeLeft <= 0) {
            timeLeft = 60;
            checkStatus();
        }
    }, 1000);

    window.onload = checkStatus;
</script>
</body>
</html>
